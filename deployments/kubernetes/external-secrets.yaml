# Syncs service secrets from the cloud secret manager provisioned by
# deployments/terraform/<cloud>. Requires the External Secrets Operator and a
# ClusterSecretStore named "platform-secrets" bound to that secret manager.
# Remote keys match the names Terraform creates; the clearinghouse and
# messaging secrets are created by their owners (see docs/runbooks/startup.md).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: patient-access-agents-database
  namespace: patient-access
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: patient-access-agents-database
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: patient-access-agents-database-url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: patient-access-agents-audit-key
  namespace: patient-access
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: patient-access-agents-audit-key
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "^patient-access-agents-audit-key-"
      rewrite:
        - regexp:
            source: "^patient-access-agents-audit-key-(.*)$"
            target: "audit-$1.pem"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: patient-access-agents-clearinghouse
  namespace: patient-access
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: patient-access-agents-clearinghouse
    creationPolicy: Owner
  data:
    - secretKey: CLEARINGHOUSE_API_KEY
      remoteRef:
        key: patient-access-agents-clearinghouse-api-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: patient-access-agents-notifications
  namespace: patient-access
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: patient-access-agents-notifications
    creationPolicy: Owner
  data:
    - secretKey: NOTIFICATION_SIGNING_KEY
      remoteRef:
        key: patient-access-agents-notification-signing-key
