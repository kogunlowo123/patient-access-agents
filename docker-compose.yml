# Local development stack: the service + PostgreSQL + a HAPI FHIR R4 server +
# an OIDC provider issuing both people's and agents' tokens + an OTel
# collector. Uses an in-memory audit key (PAA_DEV_EPHEMERAL_AUDIT_KEY); never
# use this configuration outside a developer workstation. No clearinghouse is
# configured, so eligibility goes to the manual-verification queue, and
# reminders land in the patient portal inbox.
name: patient-access-agents

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: paa
      POSTGRES_USER: paa
      POSTGRES_PASSWORD: paa-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paa -d paa"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  fhir:
    image: hapiproject/hapi:v7.4.0
    environment:
      hapi.fhir.fhir_version: R4
    ports:
      - "8090:8080"

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: "8080"
    ports:
      - "8081:8080"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deployments/docker/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  patient-access:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      fhir:
        condition: service_started
      oidc:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      PAA_ENVIRONMENT: development
      PAA_DEV_EPHEMERAL_AUDIT_KEY: "true"
      PAA_PUBLIC_URL: http://localhost:8080
      PAA_DATABASE_URL: postgresql+asyncpg://paa:paa-local-only@postgres:5432/paa
      PAA_FHIR_BASE_URL: http://fhir:8080/fhir
      PAA_OIDC_ISSUER: http://oidc:8080/patient-access
      PAA_OIDC_AUDIENCE: patient-access
      PAA_OIDC_JWKS_URL: http://oidc:8080/patient-access/jwks
      PAA_AGENT_ISSUER: http://oidc:8080/agents
      PAA_AGENT_AUDIENCE: patient-access-agents
      PAA_AGENT_JWKS_URL: http://oidc:8080/agents/jwks
      PAA_AUDIT_LOG_PATH: /var/lib/patient-access/audit/audit.jsonl
      PAA_WORKER_INTERVAL_S: "30"
      PAA_OTLP_ENDPOINT: http://otel-collector:4317
      PAA_LOG_LEVEL: DEBUG

volumes:
  pgdata:
